<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <link type="image/png" rel="shortcut icon" href="/vivaxy.icon.png" />
    <title>15 Puzzle</title>
    <link type="text/css" rel="stylesheet" href="index.css" />
    <meta name="author" content="vivaxy <xyxuye2007@126.com>" />
    <meta name="keywords" content="vivaxy,game,15-puzzle,games" />
    <meta name="description" content="15 Puzzle" />
  </head>

  <body>
    <canvas class="js-canvas"></canvas>
    <dialog class="score-container" aria-labelledby="scores-heading">
      <header>
        <h1 id="scores-heading">Scores</h1>
        <form method="dialog"><button type="submit">Close</button></form>
      </header>
      <p class="js-storage-status" role="status" hidden>
        Local storage is unavailable. Some scores are only available for this
        visit.
      </p>
      <table aria-label="Score summary">
        <thead>
          <tr>
            <th>Score</th>
            <th>Current</th>
            <th>Best</th>
          </tr>
        </thead>
        <tbody class="js-statistics"></tbody>
      </table>
      <h2>History</h2>
      <div class="score-history">
        <table aria-label="Attempt history">
          <thead>
            <tr>
              <th>Result</th>
              <th>Steps</th>
              <th>Finished</th>
            </tr>
          </thead>
          <tbody class="js-attempts"></tbody>
        </table>
      </div>
    </dialog>
    <script type="module" src="index.js"></script>
    <script type="text/javascript" charset="utf-8" src="/cm.js"></script>
  </body>
</html>
